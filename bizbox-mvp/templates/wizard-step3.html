<form hx-post="/api/wizard/step4" hx-target="#wizard-modal-body">
  <input type="hidden" name="name" value="{{.Name}}">
  <input type="hidden" name="image" value="{{.Image}}">
  <input type="hidden" name="instance_type" value="{{.InstanceType}}">
  <input type="hidden" name="cpu" value="{{.CPU}}">
  <input type="hidden" name="ram" value="{{.RAM}}">

  <label style="font-size: 13px; font-weight: 600; color: var(--text-primary); display: block; margin-bottom: 8px;">Ağ Bağlantısı Tipi</label>
  <div style="display: flex; gap: 15px; margin-bottom: 20px;">
    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 14px;">
      <input type="radio" name="network_type" value="bridged" checked onchange="toggleNetworkOptions()"> Köprülü (Bridged / OVS)
    </label>
    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 14px;">
      <input type="radio" name="network_type" value="nat" onchange="toggleNetworkOptions()"> NAT (Sadece İnternet)
    </label>
  </div>

  <div id="bridged-options" style="margin-bottom: 20px;">
    <div class="form-group">
      <label for="network-bridge">Köprü Arabirimi (vSwitch)</label>
      <select id="network-bridge" name="network_bridge" class="form-control" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
        {{range .VSwitches}}
        <option value="{{.}}">{{.}}</option>
        {{end}}
        <option value="incusbr0">incusbr0 (Varsayılan Incus Köprüsü)</option>
      </select>
      <small style="color: var(--text-secondary); font-size: 12px; display: block; margin-top: 4px;">Sistemin bağlanacağı sanal anahtarı seçin.</small>
    </div>

    <div class="form-group" style="margin-top: 15px;">
      <label for="vlan-id">VLAN ID (Opsiyonel)</label>
      <input type="number" id="vlan-id" name="vlan_id" min="1" max="4094" placeholder="örn: 10" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
      <small style="color: var(--text-secondary); font-size: 12px; display: block; margin-top: 4px;">Sistemi belirli bir OVS VLAN ağına dahil etmek istiyorsanız doldurun.</small>
    </div>
  </div>

  <div class="form-group">
    <label for="static-ip">Statik IP Adresi (Opsiyonel)</label>
    <input type="text" id="static-ip" name="static_ip" placeholder="örn: 192.168.1.50" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
    <small style="color: var(--text-secondary); font-size: 12px; display: block; margin-top: 4px;">Boş bırakılırsa IP adresi DHCP tarafından otomatik atanır.</small>
  </div>

  <div class="wizard-footer" style="margin-top: 25px;">
    <button type="button" class="btn btn-secondary" hx-post="/api/wizard/step2" hx-target="#wizard-modal-body" hx-vals='{"name": "{{.Name}}", "image": "{{.Image}}", "instance_type": "{{.InstanceType}}", "cpu": "{{.CPU}}", "ram": "{{.RAM}}"}'>Geri</button>
    <button type="submit" class="btn btn-primary">İleri</button>
  </div>
</form>

<script>
function toggleNetworkOptions() {
  const isBridged = document.querySelector('input[name="network_type"]:checked').value === 'bridged';
  const bridgedOptions = document.getElementById('bridged-options');
  
  if (isBridged) {
    bridgedOptions.style.display = 'block';
  } else {
    bridgedOptions.style.display = 'none';
  }
}
</script>
