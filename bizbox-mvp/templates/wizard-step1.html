<form hx-post="/api/wizard/step2" hx-target="#wizard-modal-body">
  <div class="form-group">
    <label for="vm-name">Sistem Adı</label>
    <input type="text" id="vm-name" name="name" required placeholder="örn: test-vm" value="{{.Name}}" autofocus>
  </div>
  
  <label style="font-size: 13px; font-weight: 600; color: var(--text-primary); display: block; margin-bottom: 8px;">İşletim Sistemi / İmaj</label>
  <input type="hidden" name="image" id="selected-image" value="{{if .Image}}{{.Image}}{{else}}images:ubuntu/22.04{{end}}">
  
  <div class="os-grid">
    <div class="os-card {{if or (not .Image) (eq .Image "images:ubuntu/22.04")}}active{{end}}" onclick="selectOS(this, 'images:ubuntu/22.04')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><circle cx="12" cy="12" r="4"/></svg>
      <h4>Ubuntu Server</h4>
      <span>ubuntu/22.04</span>
    </div>
    
    <div class="os-card {{if eq .Image "images:windows/server-2022"}}active{{end}}" onclick="selectOS(this, 'images:windows/server-2022')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
      <h4>Windows Server 2022</h4>
      <span>win/2022</span>
    </div>

    <div class="os-card {{if eq .Image "images:windows/11"}}active{{end}}" onclick="selectOS(this, 'images:windows/11')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <h4>Windows 10/11</h4>
      <span>win/11</span>
    </div>

    <div class="os-card {{if eq .Image "custom:iso"}}active{{end}}" onclick="selectOS(this, 'custom:iso')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <h4>Özel ISO</h4>
      <span>Yerel ISO dosyası</span>
    </div>
  </div>

  <div class="wizard-footer">
    <button type="button" class="btn btn-secondary" onclick="closeWizardModal()">İptal</button>
    <button type="submit" class="btn btn-primary">İleri</button>
  </div>
</form>
